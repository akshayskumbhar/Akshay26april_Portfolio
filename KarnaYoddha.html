<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Futuristic AI Chat Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Roboto&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .dashboard {
      width: 90%;
      max-width: 1200px;
      height: 90vh;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      padding: 20px;
      text-align: center;
      font-size: 2rem;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .message {
      max-width: 75%;
      padding: 15px;
      border-radius: 15px;
      animation: fadeIn 0.3s ease;
      white-space: pre-wrap;
    }
    .user {
      align-self: flex-end;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      color: #000;
    }
    .bot {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .input-box {
      display: flex;
      padding: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.3);
    }
    .input-box input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      outline: none;
      font-size: 1rem;
      background: #1e1e2f;
      color: #fff;
    }
    .input-box button {
      margin-left: 10px;
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #00f2fe;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .input-box button:hover {
      background: #4facfe;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 768px) {
      .dashboard { width: 100%; height: 100vh; border-radius: 0; }
      .header { font-size: 1.5rem; }
    }
  </style>
</head>

<body>
  <div class="dashboard">
    <div class="header">⚡ Karna Yodhha Assistant</div>
    <div class="chat-box" id="chatBox">
      <div class="message bot">Hello! I’m Karna Yoddha, your AI assistant. How can I help you today?</div>
    </div>
    <div class="input-box">
      <input type="text" id="userInput" placeholder="Type your message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");

    async function sendMessage() {
      const msg = userInput.value.trim();
      if (!msg) return;

      appendMessage(msg, "user");
      userInput.value = "";
      const thinkingMsg = appendMessage("Typing...", "bot");

      try {
        const response = await fetch(\"https://api.openai.com/v1/chat/completions\", {
          method: \"POST\",
          headers: {
            \"Content-Type\": \"application/json\",
            \"Authorization\": \"#" // ← Replace this
          },
          body: JSON.stringify({
            model: \"gpt-3.5-turbo\",
            messages: [{ role: \"user\", content: msg }],
            temperature: 0.7
          })
        });

        const data = await response.json();
        const reply = data.choices[0].message.content.trim();
        thinkingMsg.textContent = reply;

      } catch (error) {
        thinkingMsg.textContent = \"❌ Error: Unable to fetch response.\";
        console.error(error);
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendMessage(text, type) {
      const msgDiv = document.createElement(\"div\");
      msgDiv.className = `message ${type}`;
      msgDiv.textContent = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }

    userInput.addEventListener(\"keypress\", function (e) {
      if (e.key === \"Enter\") sendMessage();
    });
  </script>
</body>
</html>
